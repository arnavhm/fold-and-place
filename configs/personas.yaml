# Synthetic household for experiments and the demo.
# These counts, values and wear frequencies are LABELLED ASSUMPTIONS, not survey data.
#
# Each item: [category, count, size, value_lo, value_hi, wears_per_month]
#   value  : importance 1-10 to its owner (drawn uniformly between lo and hi with a fixed seed)
#   wears  : how often it is worn, per month, per item

personas:
