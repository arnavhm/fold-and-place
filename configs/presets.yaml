# Indian wardrobe presets. Units: cm. Coordinates: x = left->right inside the carcass,
# z = height of the compartment's floor above the room floor, d = usable depth.
#
# kind:
#   shelf      folded stacks side by side          h = clear height above the shelf
#   drawer     items filed on edge in rows          h = drawer height
#   rail_long  hanging rail for long garments       h = drop below the rod, w = rod length
#   rail_short hanging rail for shirts / folded pants
#   loft       top storage above the main carcass   (treated like a hard-to-reach shelf)
#
# Basis (Indian standards, approximate):
#   carcass 78-84 in high, 20-24 in deep (hinged); 2-door 36-48 in wide, 3-door 54-72 in;
#   sliding 24-28 in deep (Asian Paints Beautiful Homes)
#   shelf clearance 12-15 in, drawer 6-9 in, shirt hanging ~40 in (Interior Company)
#   long garments need 60-70 in of hanging space (HomeGuide)
#   loft 12-24 in high (Asian Paints)
#
# Golden zone (easiest to reach): ~18 in below waist up to shoulder height (Racklify).
# Default 55-135 cm from the floor; editable per person in the dashboard.

golden_zone_cm: [55, 135]

presets:
  one_door:
    label: "1-door hinged (52 x 200 x 53 cm)"
    width: 52
    height: 200
    depth: 53
    compartments:
      - {id: loft,    kind: loft,       x: 0,  z: 172, w: 52, h: 28, d: 53}
      - {id: rail,    kind: rail_short, x: 0,  z: 75,  w: 50, h: 95, d: 53}
      - {id: shelf1,  kind: shelf,      x: 0,  z: 40,  w: 50, h: 33, d: 50}
