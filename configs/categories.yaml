  trousers:    {label: "Trousers",      group: western, template: trousers,  base_layers: 2, flat_w: 50, flat_l: 104, rise: 28, fabric: cotton_woven,  can_hang: true,  rod_in: 1.25, hang_drop: 60, prompt: "formal trousers or chinos"}
