  shirt:       {label: "Shirt",         group: western, template: tee,       base_layers: 2, flat_w: 55, flat_l: 76,  sleeve_len: 60, sleeve_w: 22, fabric: cotton_woven,  can_hang: true,  rod_in: 1.0,  prompt: "a long-sleeve button-down shirt"}
  polo:        {label: "Polo",          group: western, template: tee,       base_layers: 2, flat_w: 52, flat_l: 72,  sleeve_len: 12, sleeve_w: 20, fabric: cotton_interlock, can_hang: true, rod_in: 1.0, prompt: "a polo shirt with a collar"}
  top:         {label: "Women's top",   group: western, template: tee,       base_layers: 2, flat_w: 46, flat_l: 62,  sleeve_len: 10, sleeve_w: 18, fabric: polyester,     can_hang: true,  rod_in: 1.0,  prompt: "a women's casual top or blouse"}
