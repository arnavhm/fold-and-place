# Garment categories (31): Western + Indian.
#
# All sizes are FLAT-LAY measurements in cm for size M (stitched garments) or the standard fabric
# size (drapes). Stitched-garment sizes are approximate typical values and are editable in the
# dashboard; drape sizes follow published standards:
#   saree ~5.5 m x 1.15 m, blouse fabric ~80 cm, dupatta ~2.5 m (Utsav Fashion),
#   dupatta width ~91-93 cm (iTokri), lehenga skirt length 42-43 in (Aza Fashions).
#
# template   : outline shape used by the fold engine (see fold_and_place/folding/templates.py)
# base_layers: fabric layers in the flat outline (2 = front + back of a stitched garment)
# sleeve_len : how far each sleeve sticks out sideways when laid flat (0 = none)
# sleeve_w   : sleeve depth along the body length
# hem_w      : width at the hem for flared shapes (defaults to flat_w)
# rise       : trousers only - waist to crotch
# drape      : true = fabric standard size, ignore S/M/L scaling
# rod_in     : rod space when hung, inches (Lowe's: shirts ~1 in, pants/skirts ~1.25 in,
#              dresses/jackets/suits 2-3 in)
# hang_drop  : vertical space needed below the rod when hung, cm (defaults to flat_l)
# embellish  : none | light | heavy (heavy => fold flat only, nothing on top, tissue between folds)
# prompt     : text used for zero-shot image classification

size_scale:            # multiply (flat_w, flat_l) for stitched garments
  S:  [0.94, 0.97]
  M:  [1.00, 1.00]
  L:  [1.06, 1.03]
  XL: [1.12, 1.06]

categories:
  # ---------------- Western ----------------
